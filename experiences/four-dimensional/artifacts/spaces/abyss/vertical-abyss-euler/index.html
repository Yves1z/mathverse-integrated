<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M4 25V7l12 14L28 7v18%22 fill=%22none%22 stroke=%22%23dbcba7%22 stroke-width=%222%22/%3E%3C/svg%3E"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathverse · 深井中的欧拉</title><style>body{margin:0;background:#0c1011;color:#dedbd0;font:14px 'Segoe UI',sans-serif}main{max-width:1500px;margin:auto;padding:34px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:25px;font-weight:400}h2{font-size:18px;font-weight:400;margin-top:40px}p{color:#a6aaa6;line-height:1.8}a{color:#e0d2b8}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{padding:12px 20px;color:#ccc;background:#161d1e;border:1px solid #3e4747;cursor:pointer}button[aria-pressed=true]{border-color:#d6c7a5;color:#fff}img,video{width:100%;display:block;background:#06090a;border:1px solid #283033}figure{margin:0}figcaption{padding:15px 0;color:#b4b4a7}video{max-height:850px}small{color:#9b9f98}</style></head><body><main><header><h1>深井中的欧拉 · 思想从结构里显露</h1><a href="/space-a/abyss/euler/">进入动态空间 ↗</a></header><p>圆弧、旋转曲面和少量纸页居于同一个内层体积。与层板共同投影，缓慢来到外部；点击可进入三次思想转向，窗口之外的巨构继续前行。</p><nav id="views"></nav><figure><img id="current" src="./outside.png" alt="深井巨构中的欧拉体积世界"><figcaption id="caption"></figcaption></figure><h2>正常速度展开与阅读实录</h2><p>保留 32 秒初始停留与 6 / 30 / 8 秒交换节奏。后段展示真实纸页与圆弧点击、三章故事、相关数学及返回。</p><video controls preload="metadata" src="./euler-demo.webm" poster="outside.png"></video><p><a href="/space-a/abyss/euler/?at=145&angle=3.141592653589793">直接审阅展开状态 ↗</a>　<a href="/space-a/abyss/exchange/">上一阶段：纯空间交换 ↗</a></p><small>纸页为当代抽象作品痕迹。阅读占屏幕 80.1%，外围位移保留原速度的 6%。局部空气与光路属于下一阶段。</small></main><script>const views=[['inside','内层隐现','固定眼点 · 内层稳定'],['midpoint','交换中段','固定眼点 · 与层板共享第四轴'],['outside','外层显露','固定眼点 · 圆、曲面与纸页'],['series','无穷与圆','1735 · 方片、级数与圆周率'],['bridges','城市与关系','四个节点，七条连接'],['rotation','指数与旋转','一个角度，共用一种关系']];const nav=document.getElementById('views');for(const [id,label,caption]of views){const b=document.createElement('button');b.dataset.view=id;b.textContent=label;b.onclick=()=>{document.getElementById('current').src=id+'.png';document.getElementById('caption').textContent=caption;for(const el of nav.children)el.setAttribute('aria-pressed',String(el===b));};nav.appendChild(b);}nav.children[2].click();</script></body></html>
