<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M4 25V7l12 14L28 7v18%22 fill=%22none%22 stroke=%22%23dbcba7%22 stroke-width=%222%22/%3E%3C/svg%3E"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathverse · 深井四维交换审阅</title><style>body{margin:0;background:#0c1011;color:#dedbd0;font:14px 'Segoe UI',sans-serif}main{max-width:1500px;margin:auto;padding:34px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:25px;font-weight:400}p{color:#a6aaa6;line-height:1.8}a{color:#e0d2b8}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{padding:12px 20px;color:#ccc;background:#161d1e;border:1px solid #3e4747;cursor:pointer}button[aria-pressed=true]{border-color:#d6c7a5;color:#fff}img,video{width:100%;display:block;background:#06090a;border:1px solid #283033}figure{margin:0}figcaption{padding:15px 0;color:#b4b4a7}h2{font-size:18px;font-weight:400;margin-top:40px}video{max-height:850px}small{color:#9b9f98}</style><main><header><h1>深井侧壁 · 一次内外交换</h1><a href="/space-a/abyss/exchange/">进入动态空间 ↗</a></header><p>同一眼点、同一照明。追踪暖白接缝：它属于密集内层板库，随第四轴投影展开到外部；井壁和巨柱保留稳定参照。</p><nav id="views"></nav><figure><img id="current" src="./inside.png" alt="同一眼点下的四维层板交换"><figcaption id="caption"></figcaption></figure><h2>完整真实行进与交换</h2><p>先沿井边行进。第 32 秒开始起势，保持 6 / 30 / 8 秒的展开节奏；录像后段演示自由扭头、定格、暂停和重新进入。</p><video controls preload="metadata" src="./exchange-demo.webm" poster="outside.png"></video><p><a href="/space-a/abyss/journey/">上一阶段：纯行进 ↗</a>　<a id="review" href="/space-a/abyss/exchange/?at=145&angle=0">进入当前定格 ↗</a></p><small>该样片实现一处有限四维投影事件。下一阶段将欧拉世界与阅读接回相同源体积。</small></main><script>const views=[['inside','内层稳定',0],['quarter','初步展开',Math.PI/4],['middle','交换中段',Math.PI/2],['three-quarter','接近外层',Math.PI*.75],['outside','外层落定',Math.PI]];const nav=document.getElementById('views');for(const [id,label,angle]of views){const b=document.createElement('button');b.textContent=label;b.dataset.view=id;b.onclick=()=>{document.getElementById('current').src=id+'.png';document.getElementById('caption').textContent=label+' · 相同路径距离 145，角度 '+(angle/Math.PI*180).toFixed(0)+'°';document.getElementById('review').href='/space-a/abyss/exchange/?at=145&angle='+angle;for(const el of nav.children)el.setAttribute('aria-pressed',String(el===b));};nav.appendChild(b);}nav.firstChild.click();</script></html>
