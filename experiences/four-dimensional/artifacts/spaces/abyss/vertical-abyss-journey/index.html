<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><title>Mathverse · 井边行进</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1011;color:#d7d1c5;font:14px/1.7 system-ui,sans-serif}main{max-width:1450px;margin:auto;padding:36px}small{letter-spacing:.17em;color:#929b97}h1{font-size:28px;font-weight:350}p{color:#aaa99d}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}a,button{color:inherit;font:inherit;background:transparent;text-decoration:none;border:1px solid #555f58;padding:8px 16px;cursor:pointer}button.active{background:#303c36}.frame{aspect-ratio:16/9}.frame img,video{width:100%;height:100%;object-fit:cover}.caption{display:flex;justify-content:space-between;margin-top:10px;color:#909a94}video{margin-top:16px;height:auto}</style><main><small>MATHVERSE / VERTICAL ABYSS / JOURNEY 02</small><h1>经过遮挡，走入深井。</h1><p>浅弧路线绕过近处巨柱，横向结构与井内层级逐渐显露。镜头保持高度与方向，拖拽独立控制扭头。</p><nav><a href="/space-a/abyss/journey/">进入行进样片 ↗</a><a href="/space-a/abyss/?view=reveal">静态构成 ↗</a><button data-view="entry" class="active">出发</button><button data-view="passing">经过巨柱</button><button data-view="opening">井口打开</button><button data-view="reveal">深井显露</button><button data-view="side">侧向</button><button data-view="up">抬头</button><button data-view="back">回望</button></nav><div class="frame"><img id="current" src="./entry.png" alt="实际网页渲染"></div><div class="caption"><span id="label">出发 · 实际网页画面</span><span>1600 × 900</span></div><p>四个路径位置固定观察方向，另外三帧来自真实拖拽。模型、灯光与材质保持稳定。</p><h1>正常速度的真实行进。</h1><p>录像保留完整发现过程，以及暂停、扭头、回正与重新行进的操作。镜头经过井口后继续前进。</p><video src="./journey-demo.webm" controls preload="metadata" playsinline></video></main><script>document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.getElementById('current').src=b.dataset.view+'.png';document.getElementById('label').textContent=b.textContent+' · 实际网页画面';document.querySelectorAll('[data-view]').forEach(e=>e.classList.toggle('active',e===b));});</script></html>
