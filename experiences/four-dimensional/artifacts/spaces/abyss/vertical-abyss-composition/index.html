<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><title>Mathverse · 垂直深井构成</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1011;color:#d7d1c5;font:14px/1.7 system-ui,sans-serif}main{max-width:1450px;margin:auto;padding:36px}small{letter-spacing:.17em;color:#929b97}h1{font-size:28px;font-weight:350}p{color:#aaa99d}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}a,button{color:inherit;font:inherit;background:transparent;text-decoration:none;border:1px solid #555f58;padding:8px 16px;cursor:pointer}button.active{background:#303c36}.frame{aspect-ratio:16/9}.frame img{width:100%;height:100%;object-fit:cover}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.three img{width:100%}.three figure{margin:0}.caption{display:flex;justify-content:space-between;margin-top:10px;color:#909a94}</style><main><small>MATHVERSE / VERTICAL ABYSS / COMPOSITION 01</small><h1>上下无尽，横向交织。</h1><p>同一模型中的近景遮挡、深井显露与侧方结构库。横向悬臂在不同高度伸展，前后背景采用错层安排。</p><nav><a href="/space-a/abyss/">进入构成样片 ↗</a><a href="/space-a/reference/">原巨构样片 ↗</a></nav><div class="three"><figure><img src="./entry.png" alt="入口遮挡"><figcaption>入口遮挡</figcaption></figure><figure><img src="./reveal.png" alt="深井显露"><figcaption>深井显露</figcaption></figure><figure><img src="./side.png" alt="侧向环顾"><figcaption>侧向环顾</figcaption></figure></div><nav><button data-view="entry" class="active">入口遮挡</button><button data-view="reveal">深井显露</button><button data-view="side">侧向环顾</button><button data-view="up">抬头</button><button data-view="down">俯视</button><button data-view="back">回望</button></nav><div class="frame"><img id="current" src="./entry.png" alt="实际网页渲染"></div><div class="caption"><span id="label">入口遮挡 · 实际网页画面</span><span>1600 × 900</span></div><p>本轮为静态构成审阅；视角按钮切换固定眼点，可自由拖拽环顾。连续行进、四维交换与欧拉内容按后续阶段接入。</p></main><script>document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.getElementById('current').src=b.dataset.view+'.png';document.getElementById('label').textContent=b.textContent+' · 实际网页画面';document.querySelectorAll('[data-view]').forEach(e=>e.classList.toggle('active',e===b));});</script></html>
