<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><title>Mathverse · 巨构光影</title><style>*{box-sizing:border-box}body{margin:0;background:#101211;color:#d6d0c5;font:14px/1.7 system-ui,sans-serif}main{max-width:1450px;margin:auto;padding:36px}small{letter-spacing:.17em;color:#929587}h1{font-size:28px;font-weight:350;margin:12px 0}p{color:#aaa99d}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}a,button{color:inherit;font:inherit;background:transparent;text-decoration:none;border:1px solid #55594c;padding:8px 16px;cursor:pointer}button.active{background:#30372b}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pair img,.frame img,video{width:100%}.frame{aspect-ratio:16/9;background:#111310}.frame img{height:100%;object-fit:cover}video{margin-top:14px}.caption{display:flex;justify-content:space-between;margin-top:10px;color:#909585}</style><main><small>MATHVERSE / GRAPHITE, LIGHT & AIR</small><h1>实体沉静，光从深处抵达。</h1><p>中性石墨灰保留清晰的受光面，深凹接缝与层间阴影加强进深。两处开口留下少量暖白光路，微尘共用空间时钟缓慢前行。</p><nav><a href="/space-a/reference/">进入光影样片 ↗</a><a href="/space-a/reference/?finish=previous">上一轮样片 ↗</a></nav><div class="pair"><figure><img src="./previous.png" alt="上一轮固定眼点"><figcaption>上一轮 · 同一眼点</figcaption></figure><figure><img src="./inside.png" alt="本轮固定眼点"><figcaption>本轮 · 同一眼点</figcaption></figure></div><nav><button data-view="inside" class="active">内部</button><button data-view="midpoint">交换中段</button><button data-view="outside">展开</button><button data-view="side">侧向</button><button data-view="up">抬头</button><button data-view="series">无穷与圆</button><button data-view="bridges">城市与关系</button><button data-view="rotation">指数与旋转</button></nav><div class="frame"><img id="current" src="./inside.png" alt="实际网页渲染"></div><div class="caption"><span id="label">内部 · 实际网页画面</span><span>1600 × 900</span></div><h1>一次完整展开，与阅读中的慢行。</h1><p>以下为真实网页正常速度录制，保留点击、故事操作与返回。</p><video src="./euler-demo.webm" controls preload="metadata" playsinline></video></main><script>document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.getElementById('current').src=b.dataset.view+'.png';document.getElementById('label').textContent=b.textContent+' · 实际网页画面';document.querySelectorAll('[data-view]').forEach(e=>e.classList.toggle('active',e===b));});</script></html>
