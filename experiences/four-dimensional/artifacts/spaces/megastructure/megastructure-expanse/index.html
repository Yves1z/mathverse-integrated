<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathverse · 巨构尺度返修</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090a0b;color:#d1cec5;font:14px/1.7 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:36px}h1{font-weight:400;font-size:28px;margin:12px 0}p{color:#8c8e8e}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}a,button{font:inherit;color:inherit;border:1px solid #363839;background:transparent;padding:8px 16px;text-decoration:none;cursor:pointer}button.active{background:#242628}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#08090a}.stage img{position:absolute;width:100%;height:100%;object-fit:cover}#before{clip-path:inset(0 50% 0 0)}#divider{position:absolute;left:50%;top:0;height:100%;border-left:1px solid #ddcdb1;pointer-events:none}input{width:100%;margin:18px 0;accent-color:#c9b99b}.caption{display:flex;justify-content:space-between;color:#949590}video{width:100%;margin:24px 0}details{margin-top:24px}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px}.views img{width:100%}small{letter-spacing:.15em;color:#858785}</style>
<main><small>MATHVERSE / MEGASTRUCTURE EXPANSE</small><h1>让空间重新拥有巨构的尺度。</h1><p>同一镜头、同一视角：打开中央虚空，拉开纵深，增加上下层和侧向巨构。欧拉体积世界保留规律性的内外翻转。</p>
<nav><a href="/space-a/euler/">进入新版空间 ↗</a><a href="/space-a/euler/?space=previous">进入上一版 ↗</a><button data-pose="compare" class="active">新旧对照</button><button data-pose="inner">内部</button><button data-pose="middle">交换中</button><button data-pose="outer">外部</button></nav>
<div class="stage"><img id="current" src="./inner.png" alt="扩展后的巨构空间"><img id="before" src="./before.png" alt="上一版空间"><div id="divider"></div></div><input id="split" type="range" min="0" max="100" value="50" aria-label="新旧画面对照分界"><div class="caption"><span id="label">左：上一版　/　右：新版</span><span>1600 × 900 · 实际网页渲染</span></div>
<details open><summary>环顾空间</summary><div class="views"><figure><img src="./forward.png" alt="中央方向的多层纵深"><figcaption>向前：层叠结构延伸至暗处</figcaption></figure><figure><img src="./up.png" alt="上下堆叠的巨构"><figcaption>抬头：主通道之外仍有巨构</figcaption></figure></div></details>
<h1>运动与阅读</h1><p>一次完整的缓慢交换、弹性环顾、定格，以及欧拉故事的三个章节。阅读时外围空间继续缓慢前进。</p><video src="./expanse-demo.webm" controls preload="metadata" playsinline></video></main>
<script>const current=document.getElementById('current'),before=document.getElementById('before'),divider=document.getElementById('divider'),split=document.getElementById('split'),label=document.getElementById('label');function update(){before.style.clipPath=`inset(0 ${100-split.value}% 0 0)`;divider.style.left=split.value+'%'}split.addEventListener('input',update);document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>{const compare=b.dataset.pose==='compare';current.src=(compare?'inner':b.dataset.pose)+'.png';before.hidden=divider.hidden=!compare;split.hidden=!compare;label.textContent=compare?'左：上一版 / 右：新版':b.textContent+' · 新版空间';document.querySelectorAll('[data-pose]').forEach(e=>e.classList.toggle('active',e===b));update()});</script></html>
