<main><small>MATHVERSE / THE SLOW JOURNEY</small><h1>从一帧画面，走进完整的空间。</h1><p>侧面、头顶与来路沿同一层叠秩序展开。镜头持续缓慢前进，拖拽控制有弹性的环顾。</p><nav><a href="/space-a/reference/?study=journey">进入行进样片 ↗</a><a href="/space-a/reference/?study=first">首帧样片 ↗</a><button data-view="forward" class="active">前方</button><button data-view="side">侧面</button><button data-view="up">抬头</button><button data-view="back">回望</button><button data-view="advanced">深入之后</button></nav>
<div class="frame"><img id="current" src="./forward.png" alt="层叠巨构前方的真实网页画面"></div><div class="caption"><span id="label">前方 · 实际网页画面</span><span>1600 × 900</span></div>
<p>前方、侧面、抬头与回望来自同一位置的实际拖拽。“深入之后”是向前 90 个场景单位的固定审阅画面，用于比较视差；下方录像展示真实速度的连续行进。</p>
<details><summary>对照最初设计方向</summary><div class="pair"><div style="aspect-ratio:16/9;overflow:hidden"><img src="../../../design/space-revision-concepts/abc-space-study.png" alt="最初的 A 层叠巨构设计方向"></div><img src="../megastructure-reference/first-view.png" alt="上一轮首帧重建"></div></details>
<h1>缓慢深入，环顾，再回到前方。</h1><p>录像保留实际交互和速度，也展示暂停后的稳定画面。</p><video src="./journey-demo.webm" controls preload="metadata" playsinline></video></main>
<script>document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.getElementById('current').src=b.dataset.view+'.png';document.getElementById('label').textContent=b.textContent+' · 实际网页画面';document.querySelectorAll('[data-view]').forEach(e=>e.classList.toggle('active',e===b));});</script></html>
