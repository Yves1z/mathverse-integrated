<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><title>Mathverse · 巨构中的欧拉</title><style>*{box-sizing:border-box}body{margin:0;background:#101211;color:#d6d0c5;font:14px/1.7 system-ui,sans-serif}main{max-width:1450px;margin:auto;padding:36px}small{letter-spacing:.17em;color:#929587}h1{font-size:28px;font-weight:350;margin:12px 0}p{color:#aaa99d}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}a,button{color:inherit;font:inherit;background:transparent;text-decoration:none;border:1px solid #55594c;padding:8px 16px;cursor:pointer}button.active{background:#30372b}.frame{aspect-ratio:16/9;background:#111310}.frame img{width:100%;height:100%;object-fit:cover}video{width:100%;margin-top:14px}.caption{display:flex;justify-content:space-between;margin-top:10px;color:#909585}</style><main><small>MATHVERSE / EULER IN THE MEGASTRUCTURE</small><h1>一个人的思想，从深处展开。</h1><p>圆、旋转曲面与少量纸页位于同一个内层体积。空间交换时，它们一起来到外部；点击图形或纸页，沿着作品进入欧拉的故事。</p><nav><a href="/space-a/reference/?finish=previous">进入欧拉样片 ↗</a><a href="/space-a/reference/?study=exchange">纯空间样片 ↗</a><button data-view="inside" class="active">藏于内部</button><button data-view="midpoint">交换中段</button><button data-view="outside">来到外部</button><button data-view="series">无穷与圆</button><button data-view="bridges">城市与关系</button><button data-view="rotation">指数与旋转</button></nav><div class="frame"><img id="current" src="./inside.png" alt="欧拉体积世界的实际网页画面"></div><div class="caption"><span id="label">藏于内部 · 实际网页画面</span><span>1600 × 900</span></div><p>三个空间阶段固定眼点；三段故事来自真实阅读交互。阅读窗口占约 80% 面积，外围巨构仍缓慢前行；纸页为当代艺术构图。</p><h1>展开、停留，再回到巨构。</h1><p>完整实录保留实际速度与交互。</p><video src="./euler-demo.webm" controls preload="metadata" playsinline></video></main><script>document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.getElementById('current').src=b.dataset.view+'.png';document.getElementById('label').textContent=b.textContent+' · 实际网页画面';document.querySelectorAll('[data-view]').forEach(e=>e.classList.toggle('active',e===b));});</script></html>
