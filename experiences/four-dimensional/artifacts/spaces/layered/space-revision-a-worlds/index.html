<section class="intro"><span class="kicker">02 / ONE ANGLE · THREE WORLDS</span><h1>层间的世界</h1><p>数学从巨构的开口里显现。一个角度，连接指数、圆与复数旋转；几页作品，留下欧拉的思想痕迹。目光停留时，外面的空间仍然缓慢深入。</p><div class="actions"><a class="primary" href="/space-a/worlds/">进入交互样片 ↗</a><a class="secondary" href="/space-a/">观看纯空间</a><a class="secondary" href="../space-revision-a-light/index.html">上一轮光影对照</a></div></section>

<h2>开口，成为另一种深度。</h2><section class="grid">
<figure><img src="./mounted-identity.png" alt="欧拉恒等式的窗口嵌在石墨灰巨构的开口中"><figcaption><strong>01 / 层间开口</strong>受光结构承担画面重量。窗内景象藏在空隙深处。</figcaption></figure>
<figure><img src="./fold-middle.png" alt="巨构折叠中数学窗口保持与所属层面的联系"><figcaption><strong>02 / 随结构展开</strong>开口与梁体共用第四轴参数。连接和遮挡随折叠改变。</figcaption></figure>
<figure><img src="./reading-identity.png" alt="欧拉恒等式在半周旋转时显现，外侧空间可见"><figcaption><strong>03 / 半周，抵达 −1</strong>窗口占画面约 80%；外侧仍以原旅程速度的 6% 前进。</figcaption></figure>
<figure><img src="./reading-rotation.png" alt="复数旋转窗口呈现螺旋与共享角度"><figcaption><strong>04 / 同一次旋转</strong>恒等式、单位圆和螺旋保留同一个角度。</figcaption></figure>

<figure><img src="./euler-bridges.png" alt="城市地形退去后留下四个节点与七条连接"><figcaption><strong>06 / 城市与关系</strong>剥离地形，观察四个节点与七条连接。</figcaption></figure>
<figure><img src="./reading-gaussian.png" alt="高斯函数曲面与局部流动粒子"><figcaption><strong>07 / 曲面的起伏</strong>抽象数学景象承担主要视觉，粒子跟随数学关系。</figcaption></figure>
