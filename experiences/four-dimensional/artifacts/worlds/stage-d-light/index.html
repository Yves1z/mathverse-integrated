<figure><img src="./connected-worlds.png" alt="石墨结构、暖色光点与流动粒子组成的数学空间"><figcaption><span>光从结构之间显露。</span><span>01 / GRAPHITE & LIGHT</span></figcaption></figure>
<div class="pair"><figure><img src="./entrance.png" alt="明亮白色空间中的极简拱门"><figcaption><span>一片明亮的白，等待另一种维度。</span><span>02 / WHITE</span></figcaption></figure><figure><img src="./door-light.png" alt="门缓慢打开时从缝隙显露的数学空间"><figcaption><span>从门缝中，窥见深处。</span><span>03 / THRESHOLD</span></figcaption></figure></div>
